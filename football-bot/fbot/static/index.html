<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f7a4d">
  <title>Value Bot · футбол</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%231f7a4d'/%3E%3Cpath d='M12 7l4 3-1.5 4.5h-5L8 10z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="12" cy="12" r="9.5"/><path d="M12 7.5l3.8 2.8-1.45 4.45h-4.7L8.2 10.3z" fill="currentColor"/>
        <path d="M12 7.5V3M15.8 10.3l4.2-1.4M14.35 14.75l2.6 3.7M9.65 14.75l-2.6 3.7M8.2 10.3L4 8.9"/>
      </svg>
      <span>Value Bot</span>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="upd">
      <div class="upd-text" id="upd-text"></div>
      <button class="btn" id="btn-update">Обновить</button>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="signals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span class="full">Сигналы</span><span class="short">Сигналы</span><span class="badge" id="badge-signals"></span></button>
    <button data-tab="fixtures"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="full">Матчи</span><span class="short">Матчи</span></button>
    <button data-tab="bets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"/><path d="M10 7v10" stroke-dasharray="2 2"/></svg><span class="full">Мои ставки</span><span class="short">Ставки</span><span class="badge" id="badge-open"></span></button>
    <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18M6 16v-4M11 16V7M16 16v-6M21 16V4"/></svg><span class="full">Статистика</span><span class="short">Итоги</span></button>
    <button data-tab="model"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg><span class="full">Модель</span><span class="short">Модель</span></button>
    <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span class="full">Настройки</span><span class="short">Ещё</span></button>
  </nav>
  <div class="progress" id="progress" hidden></div>
  <main id="view"></main>

  <dialog id="bet-dialog">
    <form method="dialog" id="bet-form">
      <div class="dlg-head">
        <b id="dlg-title">Ставка</b>
        <div class="muted small" id="dlg-sub"></div>
      </div>
      <div class="dlg-body">
        <div class="row2">
          <div class="field"><label for="dlg-odds">Кэф, по которому поставил</label>
            <input id="dlg-odds" type="number" step="0.01" min="1.01" required inputmode="decimal"></div>
          <div class="field"><label for="dlg-stake">Сумма ставки</label>
            <input id="dlg-stake" type="number" step="1" min="1" required inputmode="decimal"></div>
        </div>
        <div class="row2">
          <div class="field"><label for="dlg-book">Букмекер</label>
            <input id="dlg-book" type="text" maxlength="60" placeholder="необязательно"></div>
          <div class="field"><label for="dlg-note">Заметка</label>
            <input id="dlg-note" type="text" maxlength="300" placeholder="необязательно"></div>
        </div>
        <div class="dlg-calc" id="dlg-calc"></div>
      </div>
      <div class="dlg-foot">
        <button class="btn" value="cancel" formnovalidate>Отмена</button>
        <button class="btn primary" id="dlg-save" value="save">Записать ставку</button>
      </div>
    </form>
  </dialog>
  <div id="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
