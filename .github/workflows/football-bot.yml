# Football value bot on GitHub Pages: recompute predictions every 3 hours and publish the site.
# Any push that touches the bot runs the tests and a trial build; only main is deployed.
name: football-bot

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:
  push:
    paths:
      - "football-bot/**"
      - ".github/workflows/football-bot.yml"

permissions:
  contents: read

concurrency:
  group: football-bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: football-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: football-bot/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: football-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: football-bot/requirements*.txt
      # data/ keeps downloaded CSVs, the walk-forward cache and the bot's signal history between runs
      - name: Restore bot data
        uses: actions/cache/restore@v4
        with:
          path: football-bot/data
          key: fbot-data-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            fbot-data-${{ github.ref_name }}-
            fbot-data-
      - run: pip install -r requirements.txt
      - name: Download data, train models, build the site
        run: python -m fbot build-site --out ../_site --leagues all
      - name: Save bot data
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: football-bot/data
          key: fbot-data-${{ github.ref_name }}-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # GitHub pauses scheduled workflows in public repos after 60 days without commits;
      # re-enabling through the API on each scheduled run keeps it going.
      - name: Keep the schedule enabled
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/football-bot.yml/enable"
